<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Price List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    .subtitle { color:#666; margin-bottom:20px; }
    .subtitle p { margin:4px 0; font-size:14px; }

    body { font-family: Arial, sans-serif; padding:40px; }
    @media (max-width: 600px) { body { padding:16px; } }

    table { width: 70%; max-width: 800px; margin-left: 40px; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 10px; }
    th { background: #f4f4f4; }
    .center { text-align: center; }

    / Column sizing (for desktop table) /
    th:nth-child(1), td:nth-child(1) { width: 70%; }
    th:nth-child(2), td:nth-child(2) { width: 10%; }
    th:nth-child(3), td:nth-child(3) { width: 20%; }

    td { white-space: nowrap; }

    @media (max-width: 600px) {
      table { width: 100%; margin-left: 0; }
      th, td { padding: 8px; font-size: 14px; }
      select, input { padding: 10px; font-size: 16px; }
    }

    / Filters layout /
    .filters { margin-bottom: 16px; }
    @media (max-width: 600px) {
      .filters { display:flex; flex-direction:column; gap:10px; }
      .filters input, .filters select { width: 100%; }
      .filters label[for="searchInput"] { margin-left: 0 !important; }
      .filters input#searchInput { margin-left: 0 !important; width: 100% !important; }
    }

    / Cards (mobile) /
    .cards { display:none; }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      background: #fff;
    }
    .card h3 { margin: 0 0 6px 0; }
    .card p { margin: 4px 0; font-size: 14px; }

    @media (max-width: 600px) {
      table { display:none; }
      .cards { display:block; }
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .qty-control button {
      width: 28px;
      height: 28px;
      border: 1px solid #ccc;
      background: #f4f4f4;
      cursor: pointer;
      font-size: 16px;
      border-radius: 6px;
    }
    .qty-control button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .qty-control span { min-width: 24px; text-align: center; font-weight: bold; }
.card {
  position: relative;
}

.qty-control {
  margin-top: 0;          / remove vertical push /
}
@media (max-width: 600px) {
  .qty-control button {
    width: 26px;
    height: 26px;
    font-size: 15px;
  }
}

    
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.card-header h3 {
  margin: 0;
  padding-right: 10px;
}

    
    / Sticky bottom bar (mobile) /
    #stickyOrderBar { display: none; }
    @media (max-width: 600px) {
      #stickyOrderBar {
        display: block;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: #25D366;
        padding: 12px;
        text-align: center;
        z-index: 999;
      }
      #stickyWhatsAppBtn {
        color: white;
        font-size: 18px;
        font-weight: bold;
        text-decoration: none;
      }
      #stickySubtext {
        display: block;
        color: rgba(255,255,255,0.9);
        font-size: 12px;
        margin-top: 4px;
      }
      body { padding-bottom: 90px; } / avoid overlap /
    }

    / Make search bar same width as cards on mobile /
@media (max-width: 600px) {
  .filters input#searchInput {
    width: 100% !important;
    margin-left: 0 !important;
    box-sizing: border-box;
  }
}
  
  </style>
</head>

<body>
  <h1>Price List</h1>

  <div class="subtitle">
    <p>- Free Delivery on all orders over $100 / $10 delivery fee otherwise.</p>
    <p>- Order by Wednesday receive by Friday 5PM.</p>
    <p>- Prices exclude sales taxes and are subject to change without prior notice.</p>
    <p>- Not on the list? Just ask!</p>
  </div>

  <div class="filters">
    <label for="typeFilter"><strong>Filter by type:</strong></label>
    <select id="typeFilter">
      <option value="all">All</option>
    </select>

    <label for="searchInput" style="margin-left: 16px;"><strong>Search:</strong></label>
    <input id="searchInput" type="text" placeholder="Search items..." style="margin-left: 10px; width: 200px;">
  </div>

  <table id="priceTable">
    <thead></thead>
    <tbody></tbody>
  </table>

  <div id="cardContainer" class="cards"></div>

  <div id="stickyOrderBar">
    <a id="stickyWhatsAppBtn" href="#" target="blank">Order via WhatsApp</a>
    <span id="stickySubtext">Select quantities to build your order</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    // ===== CONFIG =====
    const WHATSAPPNUMBER = "19176258009"; // <-- CHANGE THIS
    const SHEETID = "10AKTBh0YJ2S0jtM3UNEljvJr0PX1g2SNHOd3j2xtbJ0";
    const SHEETNAME = "Sheet1";

    // ===== CART STATE (persists across filters/re-render) =====
    // key -> { item, size, price, qty }
    const cart = {};

    // ===== HELPERS =====
    function formatPrice(v) {
      const n = parseFloat(v);
      return isNaN(n) ? v : $${n.toFixed(2)};
    }

    function makeKey(row) {
      // Stable key for an item variant. Adjust if you have a unique ID column.
      const item = (row.Item || "").trim();
      const size = (row.Size || "").trim();
      return ${item}_${size}.toLowerCase();
    }

    function cartSummary() {
      const entries = Object.values(cart).filter(e => e.qty > 0);
      const itemCount = entries.reduce((sum, e) => sum + e.qty, 0);
      return { entries, itemCount };
    }

    function buildCartMessage() {
      const { entries } = cartSummary();
      const lines = [
        "HIT SEND TO CONFIRM YOUR ORDER BELOW",
        ""
      ];

      entries.forEach(e => {
        const priceTxt = formatPrice(e.price);
        const name = e.item || "";
        const size = e.size ?  (${e.size}) : "";
        lines.push(${e.qty} x ${name}${size} - ${priceTxt});
      });

      lines.push("");
      lines.push("Thank you!");

      return encodeURIComponent(lines.join("\n"));
    }

    function updateSticky(stickyBtn, stickySubtext) {
      const { entries, itemCount } = cartSummary();

      if (entries.length === 0) {
        stickyBtn.href = "#";
        stickySubtext.textContent = "Select quantities to build your order";
        return;
      }

      const msg = buildCartMessage();
      stickyBtn.href = https://wa.me/${WHATSAPPNUMBER}?text=${msg};
      stickySubtext.textContent = ${itemCount} item${itemCount === 1 ? "" : "s"} selected;
    }

    // ===== LOAD SHEET =====
    const url = https://docs.google.com/spreadsheets/d/${SHEETID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEETNAME)};

    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const table = document.getElementById("priceTable");
        const thead = table.querySelector("thead");
        const tbody = table.querySelector("tbody");
        const cardContainer = document.getElementById("cardContainer");
        const filter = document.getElementById("typeFilter");
        const searchInput = document.getElementById("searchInput");
        const stickyBtn = document.getElementById("stickyWhatsAppBtn");
        const stickySubtext = document.getElementById("stickySubtext");

        let allData = results.data.filter(r =>
          Object.values(r).some(v => String(v).trim() !== "")
        );

        // Set initial sticky state
        updateSticky(stickyBtn, stickySubtext);

        // Prevent empty-cart click
        stickyBtn.addEventListener("click", (e) => {
          if (!stickyBtn.href || stickyBtn.href.endsWith("#")) {
            e.preventDefault();
            alert("Select item quantities first.");
          }
        });

        // Build headers once (table view)
        thead.innerHTML = "";
        const headerRow = document.createElement("tr");
        Object.keys(allData[0] || {}).forEach(key => {
          const th = document.createElement("th");
          th.textContent = key;
          if (key.toLowerCase() === "size" || key.toLowerCase() === "price") th.classList.add("center");
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        // Build Type filter options once (Type is used only for filtering)
        const types = [...new Set(allData.map(r => r.Type).filter(Boolean))];
        types.forEach(type => {
          const opt = document.createElement("option");
          opt.value = type;
          opt.textContent = type;
          filter.appendChild(opt);
        });

        function render(data) {
          tbody.innerHTML = "";
          cardContainer.innerHTML = "";

          data.forEach(row => {
            // --- TABLE ROW (desktop) ---
            const tr = document.createElement("tr");
            Object.entries(row).forEach(([key, value]) => {
              const td = document.createElement("td");
              if (key.toLowerCase() === "price") {
                td.textContent = formatPrice(value);
                td.classList.add("center");
              } else {
                td.textContent = value;
                if (key.toLowerCase() === "size") td.classList.add("center");
              }
              tr.appendChild(td);
            });
            tbody.appendChild(tr);

            // --- CARD (mobile) ---
            const key = makeKey(row);
            const itemName = row.Item || "";
            const itemSize = row.Size || "";
            const itemPrice = row.Price;

            // Ensure cart entry exists (so qty persists across re-render)
            if (!cart[key]) {
              cart[key] = { item: itemName, size: itemSize, price: itemPrice, qty: 0 };
            } else {
              // keep latest display fields synced (in case sheet edits)
              cart[key].item = itemName;
              cart[key].size = itemSize;
              cart[key].price = itemPrice;
            }

            const card = document.createElement("div");
            card.className = "card";
           card.innerHTML = 
  <div class="card-header">
    <h3>${itemName}</h3>

    <div class="qty-control">
      <button class="minus">−</button>
      <span class="qty">0</span>
      <button class="plus">+</button>
    </div>
  </div>

  <p><strong>Size:</strong> ${itemSize}</p>
  <p><strong>Price:</strong> ${formatPrice(itemPrice)}</p>
;

            const qtySpan = card.querySelector(".qty");
            const plusBtn = card.querySelector(".plus");
            const minusBtn = card.querySelector(".minus");

            // Load saved qty
            let qty = cart[key].qty || 0;
            qtySpan.textContent = qty;
            minusBtn.disabled = qty === 0;

            function setQty(newQty) {
              qty = Math.max(0, newQty);
              cart[key].qty = qty;
              qtySpan.textContent = qty;
              minusBtn.disabled = qty === 0;
              updateSticky(stickyBtn, stickySubtext); // <-- updates sticky button whenever qty changes
            }

            plusBtn.onclick = () => setQty(qty + 1);
            minusBtn.onclick = () => setQty(qty - 1);

            cardContainer.appendChild(card);
          });

          // Keep sticky in sync after rerender (e.g., filtering changes)
          updateSticky(stickyBtn, stickySubtext);
        }

        function applyFilters() {
          const typeValue = filter.value;
          const searchValue = searchInput.value.toLowerCase().trim();

          let filtered = allData;

          if (typeValue !== "all") filtered = filtered.filter(r => r.Type === typeValue);

          if (searchValue) {
            filtered = filtered.filter(r =>
              Object.values(r).some(v => String(v).toLowerCase().includes(searchValue))
            );
          }

          render(filtered);
        }

        filter.addEventListener("change", applyFilters);
        searchInput.addEventListener("input", applyFilters);

        // initial render
        render(allData);
      }
    });
  </script>
</body>
</html>
