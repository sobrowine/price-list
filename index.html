<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Price List</title>

  <a
  href="https://wa.me/15551234567?text=Hello!%20I%20want%20to%20place%20an%20order."
  target="_blank"
  style="display:inline-block; padding:12px 20px; background:#25D366; color:#fff; text-decoration:none; border-radius:6px;"
>
  Order via WhatsApp
</a>

  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>

    .subtitle {
  color: #666;
  margin-bottom: 20px;
}

.subtitle p {
  margin: 4px 0;
  font-size: 14px;
}
    
    body { font-family: Arial, sans-serif; padding: 40px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 10px; }
    th { background: #f4f4f4; }
    .center {
  text-align: center;
}
/* Column sizing */
th:nth-child(1),
td:nth-child(1) {
  width: 70%;
}

th:nth-child(2),
td:nth-child(2) {
  width: 10%;
}

th:nth-child(3),
td:nth-child(3) {
  width: 20%;
}

/* Optional: keep text tidy */
td {
  white-space: nowrap;
}
  table {
  width: 70%;
  max-width: 800px;
  margin-left: 20px;;
}

  </style>
</head>
<body>

<h1>Price List</h1>
<div class="subtitle">
<p>Free Delivery on all orders over $100 / $10 delivery fee otherwise.</p>
  <p>Order by Wednesday receive by Friday 5PM.</p>
<p>Prices exclude sales taxes and are subject to change without prior notice.</p>
</div>
<label for="typeFilter"><strong>Filter by type:</strong></label>
<select id="typeFilter">
  <option value="all">All</option>
</select>

<label for="searchInput"><strong>Search:</strong></label>
<input
  type="text"
  id="searchInput"
  placeholder="Search items..."
  style="margin-left: 10px; padding: 5px; width: 200px;"
>
  
<table id="priceTable">
  <thead></thead>
  <tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
 
<script>
const SHEET_ID = "10AKTBh0YJ2S0jtM3UNEljvJr0PX1g2SNHOd3j2xtbJ0";
const SHEET_NAME = "Sheet1";

const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

Papa.parse(url, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {
    const table = document.getElementById("priceTable");
    const thead = table.querySelector("thead");
    const tbody = table.querySelector("tbody");
    const filter = document.getElementById("typeFilter");
    const searchInput = document.getElementById("searchInput");


    let allData = results.data;

    thead.innerHTML = "";
    tbody.innerHTML = "";

    /* ===== HEADERS ===== */
    const headerRow = document.createElement("tr");
    Object.keys(allData[0]).forEach(key => {
      const th = document.createElement("th");
      th.textContent = key;

      if (key.toLowerCase() === "size" || key.toLowerCase() === "price") {
        th.classList.add("center");
      }

      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);

    /* ===== BUILD FILTER OPTIONS ===== */
    const types = [...new Set(allData.map(row => row.Type))].filter(Boolean);
    types.forEach(type => {
      const option = document.createElement("option");
      option.value = type;
      option.textContent = type;
      filter.appendChild(option);
    });

    /* ===== RENDER FUNCTION ===== */
    function renderTable(data) {
      tbody.innerHTML = "";

      data.forEach(row => {
        const tr = document.createElement("tr");

        Object.entries(row).forEach(([key, value]) => {
          const td = document.createElement("td");

          if (key.toLowerCase() === "price") {
            const num = parseFloat(value);
            td.textContent = isNaN(num) ? value : `$${num.toFixed(2)}`;
            td.classList.add("center");
          } else {
            td.textContent = value;

            if (key.toLowerCase() === "size") {
              td.classList.add("center");
            }
          }

          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    /* ===== FILTER EVENT ===== */
    function applyFilters() {
  const typeValue = filter.value;
  const searchValue = searchInput.value.toLowerCase();

  let filtered = allData;

  // Type filter
  if (typeValue !== "all") {
    filtered = filtered.filter(row => row.Type === typeValue);
  }

  // Search filter
  if (searchValue) {
    filtered = filtered.filter(row =>
      Object.values(row).some(value =>
        String(value).toLowerCase().includes(searchValue)
      )
    );
  }

  renderTable(filtered);
}

filter.addEventListener("change", applyFilters);
searchInput.addEventListener("input", applyFilters);


    /* Initial render */
    renderTable(allData);
  }
});
</script>

</body>
</html>
