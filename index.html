<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Price List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    .subtitle { color:#666; margin-bottom:20px; }
    .subtitle p { margin:4px 0; font-size:14px; }

    body { font-family: Arial, sans-serif; padding:40px; }
    @media (max-width: 600px) { body { padding:16px; } }

    table { width: 70%; max-width: 800px; margin-left: 40px; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 10px; }
    th { background: #f4f4f4; }
    .center { text-align: center; }

    /* Column sizing (for desktop table) */
    th:nth-child(1), td:nth-child(1) { width: 70%; }
    th:nth-child(2), td:nth-child(2) { width: 10%; }
    th:nth-child(3), td:nth-child(3) { width: 20%; }

    td { white-space: nowrap; }

    @media (max-width: 600px) {
      table { width: 100%; margin-left: 0; }
      th, td { padding: 8px; font-size: 14px; }
      select, input { padding: 10px; font-size: 16px; }
    }

    /* Filters layout on mobile */
    .filters { margin-bottom: 16px; }
    @media (max-width: 600px) {
      .filters { display:flex; flex-direction:column; gap:10px; }
      .filters input, .filters select { width: 100%; }
    }

    /* Cards (mobile) */
    .cards { display:none; }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      background: #fff;
    }
    .card h3 { margin: 0 0 6px 0; }
    .card p { margin: 4px 0; font-size: 14px; }

    @media (max-width: 600px) {
      table { display:none; }
      .cards { display:block; }
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .qty-control button {
      width: 28px;
      height: 28px;
      border: 1px solid #ccc;
      background: #f4f4f4;
      cursor: pointer;
      font-size: 16px;
    }
    .qty-control span { min-width: 20px; text-align: center; }

    .whatsapp-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px;
      background: #25D366;
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      box-sizing: border-box;
    }

    /* Sticky bottom bar (mobile) */
    #stickyOrderBar { display: none; }
    @media (max-width: 600px) {
      #stickyOrderBar {
        display: block;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: #25D366;
        padding: 12px;
        text-align: center;
        z-index: 999;
      }
      #stickyWhatsAppBtn {
        color: white;
        font-size: 18px;
        font-weight: bold;
        text-decoration: none;
      }
      body { padding-bottom: 80px; } /* avoid overlap */
    }
  </style>
</head>

<body>
  <h1>Price List</h1>

  <div class="subtitle">
    <p>- Free Delivery on all orders over $100 / $10 delivery fee otherwise.</p>
    <p>- Order by Wednesday receive by Friday 5PM.</p>
    <p>- Prices exclude sales taxes and are subject to change without prior notice.</p>
    <p>- Not on the list? Just ask!</p>
  </div>

  <div class="filters">
    <label for="typeFilter"><strong>Filter by type:</strong></label>
    <select id="typeFilter">
      <option value="all">All</option>
    </select>

    <label for="searchInput" style="margin-left: 16px;"><strong>Search:</strong></label>
    <input id="searchInput" type="text" placeholder="Search items..." style="margin-left: 10px; width: 200px;">
  </div>

  <table id="priceTable">
    <thead></thead>
    <tbody></tbody>
  </table>

  <div id="cardContainer" class="cards"></div>

  <div id="stickyOrderBar">
    <a id="stickyWhatsAppBtn" href="#" target="_blank">Order via WhatsApp</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const WHATSAPP_NUMBER = "19179302318"; // <-- CHANGE THIS
    const SHEET_ID = "10AKTBh0YJ2S0jtM3UNEljvJr0PX1g2SNHOd3j2xtbJ0";
    const SHEET_NAME = "Sheet1";

    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const table = document.getElementById("priceTable");
        const thead = table.querySelector("thead");
        const tbody = table.querySelector("tbody");
        const cardContainer = document.getElementById("cardContainer");
        const filter = document.getElementById("typeFilter");
        const searchInput = document.getElementById("searchInput");
        const stickyBtn = document.getElementById("stickyWhatsAppBtn");

        let allData = results.data.filter(r => Object.values(r).some(v => String(v).trim() !== ""));

        // Build headers once (table view)
        thead.innerHTML = "";
        const headerRow = document.createElement("tr");
        Object.keys(allData[0] || {}).forEach(key => {
          const th = document.createElement("th");
          th.textContent = key;
          if (key.toLowerCase() === "size" || key.toLowerCase() === "price") th.classList.add("center");
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        // Build Type filter options once
        const types = [...new Set(allData.map(r => r.Type).filter(Boolean))];
        types.forEach(type => {
          const opt = document.createElement("option");
          opt.value = type;
          opt.textContent = type;
          filter.appendChild(opt);
        });

        function formatPrice(v) {
          const n = parseFloat(v);
          return isNaN(n) ? v : `$${n.toFixed(2)}`;
        }

        function render(data) {
          tbody.innerHTML = "";
          cardContainer.innerHTML = "";

          data.forEach(row => {
            // --- TABLE ROW ---
            const tr = document.createElement("tr");
            Object.entries(row).forEach(([key, value]) => {
              const td = document.createElement("td");
              if (key.toLowerCase() === "price") {
                td.textContent = formatPrice(value);
                td.classList.add("center");
              } else {
                td.textContent = value;
                if (key.toLowerCase() === "size") td.classList.add("center");
              }
              tr.appendChild(td);
            });
            tbody.appendChild(tr);

            // --- CARD (mobile) ---
            let qty = 0;

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <h3>${row.Item || ""}</h3>
              <p><strong>Size:</strong> ${row.Size || ""}</p>
              <p><strong>Price:</strong> ${formatPrice(row.Price)}</p>

              <div class="qty-control">
                <button class="minus">−</button>
                <span class="qty">0</span>
                <button class="plus">+</button>
              </div>

                    `;

            const qtySpan = card.querySelector(".qty");
            const plusBtn = card.querySelector(".plus");
            const minusBtn = card.querySelector(".minus");
           

            minusBtn.disabled = true;

            plusBtn.onclick = () => {
              qty++;
              qtySpan.textContent = qty;
              minusBtn.disabled = qty === 0;
              updateSticky();
            };

            minusBtn.onclick = () => {
              if (qty > 0) qty--;
              qtySpan.textContent = qty;
              minusBtn.disabled = qty === 0;
              updateSticky();
            };

            function buildMessage() {
              const priceText = formatPrice(row.Price);
              return encodeURIComponent(
                `Hi, I'd like to order:\n${row.Item || ""} - ${row.Size || ""}\nQuantity: ${qty}\nPrice: ${priceText}`
              );
            }

            function getWaLink() {
              return `https://wa.me/${WHATSAPP_NUMBER}?text=${buildMessage()}`;
            }

           function updateSticky() {
  if (qty === 0) return; // only update when quantity > 0
  stickyBtn.href = getWaLink();
}

    stickyBtn.addEventListener("click", (e) => {
  if (!stickyBtn.href || stickyBtn.href.endsWith("#")) {
    e.preventDefault();
    alert("Select an item and quantity first.");
  }
});
stickyBtn.href = "#";
        

            // Optional: tapping the card updates sticky button to this item (even before ordering)
            card.addEventListener("click", () => {
              if (qty > 0) stickyBtn.href = getWaLink();
            });

            cardContainer.appendChild(card);
          });
        }

        function applyFilters() {
          const typeValue = filter.value;
          const searchValue = searchInput.value.toLowerCase().trim();

          let filtered = allData;

          if (typeValue !== "all") filtered = filtered.filter(r => r.Type === typeValue);

          if (searchValue) {
            filtered = filtered.filter(r =>
              Object.values(r).some(v => String(v).toLowerCase().includes(searchValue))
            );
          }

          render(filtered);
        }

        filter.addEventListener("change", applyFilters);
        searchInput.addEventListener("input", applyFilters);

        // initial render
        render(allData);
      }
    });
  </script>
</body>
</html>
